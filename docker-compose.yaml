services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab_frontend
    ports:
      - "3000:5000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_WS_URL=http://localhost:8005
    networks:
      - lab_network
    # Temporarily remove depends_on for initial test
    # depends_on:
    #   api_gateway:
    #     condition: service_healthy
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure

  api_gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: lab_api_gateway
    ports:
      - "5000:5000"
    volumes:
      - ./api-gateway:/app
    environment:
      - NODE_ENV=development
      # - COMPONENT_SERVICE_URL=http://component_service:8001
      # - HACKATHON_SERVICE_URL=http://hackathon_service:8002
      # - FACULTY_SERVICE_URL=http://faculty_service:8003
      - AUTH_SERVICE_URL=http://auth_service:8004
      - NOTIFICATION_SERVICE_URL=http://notification_service:8005
      # Teacher accounts, login sessions and assessments live in Postgres
      - DATABASE_URL=postgresql://labuser:labpassword@postgres:5432/labdb
    networks:
      - lab_network
    # Temporarily disable strict depends_on
    # depends_on: { ... }
    command: sh -c "echo '[API Gateway] Starting...' && npm install -g nodemon && npm run dev"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

